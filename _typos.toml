[files]
extend-exclude = [
  "*.lock",
  "*.svg",
  "*.min.*",
  "dist/",
  "build/",
  ".git/",
  "storybook-static/",
  ".visual/",
  "*.generated.css",
  "*.generated.ts",
  # German sample copy: the checker knows English only.
  "*.stories.tsx",
  # The example slide beside a slide part, shown in its story and in the catalog.
  "*.example.tsx",
  # The sample content stories share (an answer, its sources, files).
  "story-*.ts",
  "story-*.tsx",
  "apps/docs/src/app/",
  # Pictures.
  "packages/ui/visual-baseline/",
  # The prebuilt slide player: a minified script, stylesheets and fonts as data.
  "packages/ui/player/",
  # The decks the command-line tool is tested on: German copy, as a deck carries it.
  "packages/slides/fixtures/",
]

[default]
# The commit links release-please writes into a changelog: a short and a full hash, read as
# words ("e61ba3c" holds "ba"). Only the link is skipped; the entry's words are still checked.
extend-ignore-re = ["\\[[0-9a-f]{7,}\\]\\(https://github\\.com/[^)]*/commit/[0-9a-f]{40}\\)"]

[default.extend-words]
# German words in the library's own copy (labels, error messages, the forms a typed date and
# time are read in), and "Fase", the name of the design direction.
sie = "sie"
ein = "ein"
beginn = "beginn"
alle = "alle"
ende = "ende"
ist = "ist"
produkt = "produkt"
titel = "titel"
als = "als"
fase = "fase"
# The consent banner's copy.
oder = "oder"
unter = "unter"
tage = "tage"
adresse = "adresse"
# The command palette's copy.
suche = "suche"
# The multi-select's hint for assistive tech ("Am Anfang des Felds …").
felds = "felds"
# The words for kinds of file under an attachment's name.
dokument = "dokument"
archiv = "archiv"
# "Offen", the name of a table look Justin was shown, recorded in DESIGN.md's decisions.
offen = "offen"
# A relative time („vor 5 Minuten“), and the example label of a stored secret („Signatur-Secret“).
vor = "vor"
signatur = "signatur"
# What a chart's plot is called to assistive tech („Diagramm“).
diagramm = "diagramm"
# A folder, as a file tile names it to assistive tech and a file grid labels its section.
ordner = "ordner"
# The German names of two slide pictograms, as a screen reader says them („Paket“, „Modell“).
paket = "paket"
modell = "modell"
# German sample copy quoted in a slide part's doc comment („lokale Geschäfte“).
lokale = "lokale"
# How a deck's name writes the umlaut ü (ä is ae, ö is oe, ü is ue).
ue = "ue"
