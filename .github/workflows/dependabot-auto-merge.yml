name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Auto-merge minor/patch; leave major updates for manual review. Playwright never: every
      # version is a new browser build, which needs a new image tag and a redrawn baseline.
      - name: Enable auto-merge (minor/patch)
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' && !contains(fromJSON(steps.meta.outputs.updated-dependencies-json).*.dependencyName, 'playwright') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
