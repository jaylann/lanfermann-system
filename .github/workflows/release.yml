name: Release

# On every push to main, release-please opens or updates one release PR per package: the next
# version of @lanfermann/ui or of @lanfermann/slides and its CHANGELOG, read from the
# Conventional Commits that touched the package since its last release. Merging such a PR tags
# vX.Y.Z (the library) or slides-vX.Y.Z (the deck tool) and creates the GitHub release; then,
# for each package that was released,
#   build    installs, builds and packs the package, without privileges (contents: read)
#   publish  publishes that tarball with npm trusted publishing and provenance (no NPM_TOKEN),
#            in the `release` environment (main only), installing nothing
# and once for the push
#   sync     brings the release commit back to stage: a fast-forward, or a main → stage PR when
#            stage moved on in the meantime
#
# npm trusts exactly this file name and that environment (each package's trusted publisher), so
# renaming either breaks publishing. Every package needs a trusted publisher of its own on npm:
# @lanfermann/slides must be given one (this repository, this workflow file, the `release`
# environment) before its first release, or that release's publish job fails.
#
# The release PRs are opened with GITHUB_TOKEN, so GitHub runs no CI on them: they change only
# the version and the changelog. That needs the repository setting "Allow GitHub Actions to
# create and approve pull requests".
on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release in flight; queue the next push behind it instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commits, tags and GitHub releases
      pull-requests: write # the release PRs
      issues: write # the release PRs' labels
    outputs:
      # What this push released, as the matrix of the build and publish jobs: a list of
      # { name, dir, tarball, tag, version }. "[]" when nothing was released.
      packages: ${{ steps.packages.outputs.packages }}
      # The tags of those releases, for the words of the sync job.
      tags: ${{ steps.packages.outputs.tags }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Without it release-please works on the repository's default branch, stage.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: List the released packages
        id: packages
        env:
          UI_CREATED: ${{ steps.release.outputs['packages/ui--release_created'] }}
          UI_TAG: ${{ steps.release.outputs['packages/ui--tag_name'] }}
          UI_VERSION: ${{ steps.release.outputs['packages/ui--version'] }}
          SLIDES_CREATED: ${{ steps.release.outputs['packages/slides--release_created'] }}
          SLIDES_TAG: ${{ steps.release.outputs['packages/slides--tag_name'] }}
          SLIDES_VERSION: ${{ steps.release.outputs['packages/slides--version'] }}
        run: |
          packages='[]'
          tags=''
          add() {
            packages="$(jq -c \
              --arg name "$1" --arg dir "$2" --arg tarball "$3" --arg tag "$4" --arg version "$5" \
              '. + [{name: $name, dir: $dir, tarball: $tarball, tag: $tag, version: $version}]' \
              <<<"$packages")"
            tags="${tags:+$tags, }$4"
          }
          if [ "$UI_CREATED" = "true" ]; then
            add "@lanfermann/ui" packages/ui lanfermann-ui "$UI_TAG" "$UI_VERSION"
          fi
          if [ "$SLIDES_CREATED" = "true" ]; then
            add "@lanfermann/slides" packages/slides lanfermann-slides "$SLIDES_TAG" "$SLIDES_VERSION"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "released: ${tags:-nothing}"

  # main now carries the release commit (version, CHANGELOG, manifest), and stage needs it before
  # the next stage → main merge. Usually stage is an ancestor of main, so stage is fast-forwarded.
  # If something landed on stage while the release was cut, nothing is overwritten: a main → stage
  # PR is opened instead. A push made with GITHUB_TOKEN starts no workflow; CI already ran on main.
  sync:
    name: Bring the release back to stage
    needs: release-please
    if: ${{ needs.release-please.outputs.tags != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # fast-forward stage
      pull-requests: write # or open the main → stage PR
    env:
      TAG: ${{ needs.release-please.outputs.tags }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward stage, or open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin stage
          if git merge-base --is-ancestor origin/stage HEAD; then
            git push origin HEAD:refs/heads/stage
            echo "stage fast-forwarded to the $TAG release."
          elif [ -n "$(gh pr list --base stage --head main --state open --json number --jq '.[].number')" ]; then
            echo "stage moved on, and a main → stage PR is already open."
          else
            gh pr create --base stage --head main \
              --title "chore: bring the $TAG release back to stage" \
              --body "stage moved on while $TAG was cut, so it could not be fast-forwarded. Merge this to bring the release commit (version, CHANGELOG, manifest) to stage."
          fi

  # Dependency code runs here, in a job that holds no token worth stealing. Once per package
  # that was released; one that fails does not stop the other.
  build:
    name: Build ${{ matrix.package.name }}
    needs: release-please
    if: ${{ needs.release-please.outputs.tags != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    env:
      NAME: ${{ matrix.package.name }}
      TARBALL: ${{ matrix.package.tarball }}
      VERSION: ${{ matrix.package.version }}
      DIR: ${{ matrix.package.dir }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.tag }}
          persist-credentials: false

      # bun install builds @lanfermann/ui (postinstall); the build below makes it explicit, and
      # builds the deck tool when that is what was released.
      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: |
          bun run --filter @lanfermann/ui build
          if [ "$NAME" != "@lanfermann/ui" ]; then bun run --filter "$NAME" build; fi

      # The deck tool names the library as `workspace:*`. npm would publish that range as it
      # stands, and `bun pm pack` fills in the version of bun.lock, which a release does not
      # move (it wrote 0.9.0 for a library at 0.12.0). So the real version is written here, from
      # the library's own package.json at this tag. Only this checkout is changed.
      - name: Write the versions of workspace dependencies
        run: node packages/slides/scripts/pin-workspace.ts "$DIR"

      - name: Pack
        working-directory: ${{ matrix.package.dir }}
        run: |
          mkdir -p ../../build/npm
          npm pack --pack-destination ../../build/npm
          test -f "../../build/npm/$TARBALL-$VERSION.tgz"

      # A range of this workspace means nothing on npm, and a version of the library that was
      # never released would not install: the tarball must name the library as it is at this tag.
      - name: Check the tarball's dependencies
        run: |
          tar -xOzf "build/npm/$TARBALL-$VERSION.tgz" package/package.json > build/npm/packed.json
          if grep -q '"workspace:' build/npm/packed.json; then
            echo "::error::The packed package.json of $NAME still holds a workspace: range."
            exit 1
          fi
          node -e '
            const read = (file) => JSON.parse(require("node:fs").readFileSync(file, "utf8"));
            const wanted = read("packages/ui/package.json").version;
            const named = (read("build/npm/packed.json").dependencies ?? {})["@lanfermann/ui"];
            if (named !== undefined && named !== wanted) {
              console.log("::error::The tarball depends on @lanfermann/ui " + named + ", the library is at " + wanted + ".");
              process.exit(1);
            }
            console.log(named === undefined ? "no dependency on the library" : "@lanfermann/ui " + named);
          '
          rm build/npm/packed.json

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ matrix.package.tarball }}
          path: build/npm/${{ matrix.package.tarball }}-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball the build job packed. npm signs the provenance statement with this
  # job's OIDC token; it names this workflow and the release tag. Plain Node and the npm it
  # bundles, scripts off, nothing installed.
  publish:
    name: Publish ${{ matrix.package.name }} to npm
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.tags != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    environment:
      name: release
      url: https://www.npmjs.com/package/${{ matrix.package.name }}
    permissions:
      contents: read # check out the release tag (Node version, package name)
      id-token: write # OIDC for npm trusted publishing and provenance
    env:
      NAME: ${{ matrix.package.name }}
      DIR: ${{ matrix.package.dir }}
      TARBALL: ${{ matrix.package.tarball }}
      VERSION: ${{ matrix.package.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ matrix.package.tarball }}
          path: build/npm

      - name: Check the tarball's name and version
        run: |
          expected="$(node -p 'require(process.argv[1]).name' "./$DIR/package.json")@$VERSION"
          tarball="build/npm/$TARBALL-$VERSION.tgz"
          test -f "$tarball"
          packed="$(tar -xOzf "$tarball" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            console.log(pkg.name + "@" + pkg.version);
          ')"
          if [ "$packed" != "$expected" ] || [ "$expected" != "$NAME@$VERSION" ]; then
            echo "::error::The tarball holds $packed, expected $NAME@$VERSION."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles a newer npm; this only fails
      # loudly if that ever stops being true.
      - name: Check the npm version
        run: |
          node -e '
            const [have, need] = [process.argv[1], "11.5.1"].map((v) => v.split(".").map(Number));
            const older = have[0] - need[0] || have[1] - need[1] || have[2] - need[2];
            if (older < 0) {
              console.log("::error::npm " + process.argv[1] + " is too old for trusted publishing (need >= 11.5.1)");
              process.exit(1);
            }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"

      - name: Publish to npm
        run: |
          if [ -n "$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null)" ]; then
            echo "$NAME@$VERSION is already on npm; skipping (re-run)."
          else
            npm publish "build/npm/$TARBALL-$VERSION.tgz" --provenance --access public --ignore-scripts
          fi
