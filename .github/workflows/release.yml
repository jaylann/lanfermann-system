name: Release

# On every push to main, release-please opens or updates the release PR: the next version of
# @lanfermann/ui and its CHANGELOG, read from the Conventional Commits since the last release.
# Merging that PR tags vX.Y.Z and creates the GitHub release; then
#   build    installs, builds and packs the package, without privileges (contents: read)
#   publish  publishes that tarball with npm trusted publishing and provenance (no NPM_TOKEN),
#            in the `release` environment (main only), installing nothing
#
# npm trusts exactly this file name and that environment (the package's trusted publisher), so
# renaming either breaks publishing.
#
# The release PR is opened with GITHUB_TOKEN, so GitHub runs no CI on it: it changes only the
# version and the changelog. That needs the repository setting "Allow GitHub Actions to create and
# approve pull requests". After a release, merge main back into stage.
on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release in flight; queue the next push behind it instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commits, tags and GitHub releases
      pull-requests: write # the release PR
      issues: write # the release PR's labels
    outputs:
      release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/ui--tag_name'] }}
      version: ${{ steps.release.outputs['packages/ui--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Without it release-please works on the repository's default branch, stage.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Dependency code runs here, in a job that holds no token worth stealing.
  build:
    name: Build the package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # bun install builds @lanfermann/ui (postinstall); the build below makes it explicit.
      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build
        run: bun run --filter @lanfermann/ui build

      - name: Pack
        working-directory: packages/ui
        run: |
          mkdir -p ../../build/npm
          npm pack --pack-destination ../../build/npm
          test -f "../../build/npm/lanfermann-ui-$VERSION.tgz"

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: build/npm/lanfermann-ui-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball the build job packed. npm signs the provenance statement with this
  # job's OIDC token; it names this workflow and the release tag. Plain Node and the npm it
  # bundles, scripts off, nothing installed.
  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/@lanfermann/ui
    permissions:
      contents: read # check out the release tag (Node version, package name)
      id-token: write # OIDC for npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: build/npm

      - name: Check the tarball's name and version
        run: |
          expected="$(node -p 'require("./packages/ui/package.json").name')@$VERSION"
          tarball="build/npm/lanfermann-ui-$VERSION.tgz"
          test -f "$tarball"
          packed="$(tar -xOzf "$tarball" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            console.log(pkg.name + "@" + pkg.version);
          ')"
          if [ "$packed" != "$expected" ]; then
            echo "::error::The tarball holds $packed, expected $expected."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles a newer npm; this only fails
      # loudly if that ever stops being true.
      - name: Check the npm version
        run: |
          node -e '
            const [have, need] = [process.argv[1], "11.5.1"].map((v) => v.split(".").map(Number));
            const older = have[0] - need[0] || have[1] - need[1] || have[2] - need[2];
            if (older < 0) {
              console.log("::error::npm " + process.argv[1] + " is too old for trusted publishing (need >= 11.5.1)");
              process.exit(1);
            }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"

      - name: Publish to npm
        run: |
          if [ -n "$(npm view "@lanfermann/ui@$VERSION" version --prefer-online 2>/dev/null)" ]; then
            echo "@lanfermann/ui@$VERSION is already on npm; skipping (re-run)."
          else
            npm publish "build/npm/lanfermann-ui-$VERSION.tgz" --provenance --access public --ignore-scripts
          fi
