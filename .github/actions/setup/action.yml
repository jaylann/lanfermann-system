name: Setup toolchain
description: Install bun (version from package.json) + Node from .nvmrc, then install dependencies (postinstall builds @lanfermann/ui).

runs:
  using: composite
  steps:
    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
